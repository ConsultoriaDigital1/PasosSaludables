name: Deploy to VPS

# Cada push a main (o ejecucion manual) intenta desplegar por SSH al VPS.
# OJO: la red de Hostinger bloquea de forma intermitente las IPs de GitHub
# Actions (timeout en el puerto 22 sin que el paquete llegue al VPS), asi que
# el deploy por SSH es "best effort". El mecanismo confiable es el cron del
# VPS (/usr/local/bin/deploy-pasossaludables.sh, ver scripts/deploy-pull.sh)
# que cada minuto hace git fetch de main y reconstruye la app si hay commits
# nuevos. La DB (volumen pgdata) y las imagenes (volumen uploads) no se tocan.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  VPS_HOST: 72.60.15.125
  VPS_USER: root
  VPS_PATH: /opt/pasossaludables

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar SSH y probar conexion (con reintentos)
        id: ssh
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ ! -s ~/.ssh/deploy_key ]; then
            echo "::error::El secreto VPS_SSH_KEY esta vacio o no existe."
            exit 1
          fi
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          for i in 1 2 3; do
            echo "Intento $i de conexion SSH al VPS..."
            if $SSH "$VPS_USER@$VPS_HOST" "echo Conectado OK a \$(hostname)"; then
              echo "reachable=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "reachable=false" >> "$GITHUB_OUTPUT"
          echo "::warning::No se pudo conectar por SSH desde GitHub (Hostinger bloquea IPs de Actions de forma intermitente). No pasa nada: el cron del VPS detectara este commit y desplegara solo en ~1 minuto."

      - name: Desplegar por SSH
        if: steps.ssh.outputs.reachable == 'true'
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          $SSH "$VPS_USER@$VPS_HOST" "/usr/local/bin/deploy-pasossaludables.sh"

      - name: Verificar que la app responde
        if: steps.ssh.outputs.reachable == 'true'
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          $SSH "$VPS_USER@$VPS_HOST" "\
            sleep 5 && \
            curl -fsS -o /dev/null -w 'App responde: HTTP %{http_code}\n' http://localhost:8090/ || \
            (echo '::error::La app NO respondio tras el deploy' && cd $VPS_PATH && docker compose logs --tail=50 app && exit 1)"
