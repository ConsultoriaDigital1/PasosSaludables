name: Deploy to VPS

# Cada push a main (o ejecucion manual) sincroniza el codigo al VPS
# y reconstruye SOLO el contenedor `app`. La base de datos (volumen pgdata)
# y las imagenes subidas (volumen uploads) NO se tocan: persisten entre deploys.
# El esquema de la DB se auto-aplica solo al arrancar la app (ensureSchema()).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Evita deploys solapados: si llega un push nuevo mientras corre uno, espera.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  VPS_HOST: 72.60.15.125
  VPS_USER: root
  VPS_PATH: /opt/pasossaludables

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar y probar SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ ! -s ~/.ssh/deploy_key ]; then
            echo "::error::El secreto VPS_SSH_KEY esta vacio o no existe. Cargalo en Settings > Secrets > Actions."
            exit 1
          fi
          # IMPORTANTE: ruta absoluta ($HOME), nunca ~ dentro de variables.
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25"
          echo "Probando conexion SSH al VPS..."
          $SSH "$VPS_USER@$VPS_HOST" "echo Conectado OK a \$(hostname)"

      - name: Sincronizar codigo al VPS
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25"
          rsync -az --delete \
            -e "$SSH" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.astro' \
            --exclude='.vercel' \
            --exclude='.env' \
            --exclude='uploads' \
            --exclude='*.log' \
            ./ "$VPS_USER@$VPS_HOST:$VPS_PATH/"

      - name: Reconstruir y levantar la app
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25"
          $SSH "$VPS_USER@$VPS_HOST" "\
            cd $VPS_PATH && \
            docker compose up -d --build app && \
            docker image prune -f && \
            date -u +'%Y-%m-%dT%H:%M:%SZ' > .last_deploy && \
            echo 'Deploy marcado en .last_deploy'"

      - name: Verificar que la app responde
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25"
          $SSH "$VPS_USER@$VPS_HOST" "\
            sleep 5 && \
            curl -fsS -o /dev/null -w 'App responde: HTTP %{http_code}\n' http://localhost:8090/ || \
            (echo '::error::La app NO respondio tras el deploy' && cd $VPS_PATH && docker compose logs --tail=50 app && exit 1)"
