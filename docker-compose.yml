services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pasos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pasos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pasos} -d ${POSTGRES_DB:-pasos}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pasos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pasos}
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      UPLOADS_DIR: /app/uploads
      AUTH_USERNAME: ${AUTH_USERNAME}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - uploads:/app/uploads
    ports:
      - "8090:4321"
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.pasossaludables.rule=Host(`pasossaludables.72.60.15.125.nip.io`)"
      - "traefik.http.routers.pasossaludables.entrypoints=websecure"
      - "traefik.http.routers.pasossaludables.tls.certresolver=mytlschallenge"
      - "traefik.http.services.pasossaludables.loadbalancer.server.port=4321"

networks:
  default:
  traefik:
    external: true
    name: n8n_default

volumes:
  pgdata:
  uploads:
